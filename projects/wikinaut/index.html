    <div class="scene" id="scene"></div>
    <noscript><div class="noscript-doc"><h2>Projects</h2><h3>Wikinaut</h3><h4>Wikinaut</h4><p class="p">A space-themed navigation game for Wikipedia. Name a destination article and your ship flies the shortest link path there, hop by hop, through the real links on each live page.</p><p class="note"></p><p class="note">Python · Flask · JavaScript · SQLite · Fly.io</p><p class="credit">The backend is a fork of Six Degrees of Wikipedia (jwngr/sdow) by Jacob Wenger.</p><p><a href="https://github.com/jackcareynapa/wikinaut#install-the-userscript" target="_blank" rel="noopener">Open project</a> · <a href="https://github.com/jackcareynapa/wikinaut" target="_blank" rel="noopener">View source</a></p><p class="kicker">How to play</p><ol><li><strong>Set coordinates.</strong> Open any English Wikipedia article and type a destination into the console. Autocomplete helps.</li><li><strong>Chart course.</strong> The backend finds the shortest link path and draws it as a star map. When several routes tie, the pager steps through them.</li><li><strong>Launch.</strong> The ship flies to each next link on the page and jumps through hyperspace to the next article, until you arrive.</li></ol><p class="kicker">How it works</p><ol class="flow"><li>Userscript: console + flight on the live page</li><li>Flask API: Docker on Fly.io</li><li>Bidirectional BFS: memory-mapped CSR arrays</li><li>SQLite link graph: built from Wikipedia dumps</li></ol><p></p><ul><li>Rebuilt the multi-GB data pipeline in Python 3 for Wikipedia&#x27;s 2024 schema change, which silently broke upstream builds.</li><li>Live-page link matching handles redirects, two page renderers and collapsed sections, with a direct-URL fallback.</li></ul><p><a href="/text/">Read the whole site as plain text</a></p></div></noscript>
