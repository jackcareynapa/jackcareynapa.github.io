    <noscript><div class="noscript-doc"><h2>About Me</h2><h3>Side B</h3><h4>Creativity and computation</h4><p class="p">It started with Minecraft: a world where you could build anything, which made me want to build the world itself. Now I study computer science at Duke, and I believe creativity and computation belong together.</p><p class="p">The other half of my week is improv and theater, with Duke Improv and Hoof &#x27;n&#x27; Horn. Improv taught me that the best moment in a scene is the one nobody saw coming, and that&#x27;s how I design: subvert the expectation, stay unpredictable, keep people on their toes.</p><p class="p">The purest version so far is The Worst Tutorial Ever, a PICO-8 tutorial that lies to you, swaps your controls and never lets you skip it.</p><p><a href="/text/">Read the whole site as plain text</a></p></div></noscript>
