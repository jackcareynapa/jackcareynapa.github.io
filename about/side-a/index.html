    <noscript><div class="noscript-doc"><h2>About Me</h2><h3>Side A</h3><h4>Napa, California</h4><p class="p">I grew up in Napa, among vineyards that change with the seasons: green in spring, gold at harvest, bare by winter. The hills around them go gold every summer, and I&#x27;ve spent a lot of summers finding out what&#x27;s past the next one.</p><p class="p">My idea of a good afternoon is driving around with no particular plan. I go on Google Earth looking for swimming holes, then go and see whether they&#x27;re real. Some of them come with cliffs. I jump.</p><p class="p">My favourite place in the world is Mt. Tamalpais at sunset.</p><p><a href="/text/">Read the whole site as plain text</a></p></div></noscript>
