<html lang="en">
<head>

<meta property="og:url" content="{{CANONICAL}}">
<meta property="og:image" content="{{OG_IMAGE}}">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#120b07">
<link rel="icon" href="{{BASE}}assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

</head>
<body>
<a class="skip-link" href="#display">Skip to the display</a>
<nav class="text-nav" aria-label="Text navigation">
  <button type="button" class="index-plate" id="index-open" aria-haspopup="dialog">Index</button>
  <button type="button" class="index-plate" data-act="sound" role="switch" aria-checked="true"><i class="dot" aria-hidden="true"></i>Sound</button>
</nav>
<div class="viewport">
  <main class="stage" id="stage" aria-labelledby="station-title">
    <h1 class="sr-only" id="station-title">{{OWNER}}: listening station</h1>
    <div class="scene" id="scene"></div>
    <noscript>{{NOSCRIPT}}</noscript>
  </main>
  <section class="display" id="display" aria-label="Now playing" hidden></section>
</div>
<dialog class="index-dialog" id="index-dialog" aria-labelledby="index-title"></dialog>
<p class="sr-only" id="announcer" aria-live="polite"></p>
<script src="{{BASE}}assets/content.js"></script>
<script src="{{BASE}}assets/art.js"></script>
<script src="{{BASE}}assets/music.js"></script>
<script type="module" src="{{BASE}}assets/deck3d.js"></script>
<script type="module" src="{{BASE}}assets/app.js"></script>
</body>
</html>
